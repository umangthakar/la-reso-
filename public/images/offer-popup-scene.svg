<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!--
    Le Rasa — luxury bakery scene behind the home-page offer popup.

    Drawn rather than photographed so it stays a few KB and needs no external
    host. The shapes are deliberately large and high-contrast: the popup blurs
    this by 6-10px, and anything fussier than this would dissolve into mush.
    Palette is the brand's — burgundy, chocolate, blush, gold.

    Composition note: the popup paints this with background-size:cover, and the
    card is portrait, so only the middle ~60% of the width survives the crop.
    Every element that has to stay visible lives inside x 170-630.
  -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#75273f"/>
      <stop offset="0.45" stop-color="#4a1927"/>
      <stop offset="1" stop-color="#2a1310"/>
    </linearGradient>
    <radialGradient id="keylight" cx="0.24" cy="0.08" r="0.75">
      <stop offset="0" stop-color="#ffca86" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffca86" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bokeh">
      <stop offset="0" stop-color="#ffdda1" stop-opacity="0.55"/>
      <stop offset="0.65" stop-color="#f6c778" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#f6c778" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sponge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9e6cb"/>
      <stop offset="0.55" stop-color="#edd0ab"/>
      <stop offset="1" stop-color="#d2ab81"/>
    </linearGradient>
    <linearGradient id="ganache" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b3220"/>
      <stop offset="1" stop-color="#2f180f"/>
    </linearGradient>
    <linearGradient id="berry" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#e8455c"/>
      <stop offset="0.55" stop-color="#c31f3f"/>
      <stop offset="1" stop-color="#8d0f2a"/>
    </linearGradient>
    <linearGradient id="blue" x1="0.25" y1="0.1" x2="0.8" y2="1">
      <stop offset="0" stop-color="#6d6ab0"/>
      <stop offset="0.5" stop-color="#3d3a80"/>
      <stop offset="1" stop-color="#221f4d"/>
    </linearGradient>
    <linearGradient id="shellA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8d9d6"/>
      <stop offset="1" stop-color="#dda9a5"/>
    </linearGradient>
    <linearGradient id="shellB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d79a"/>
      <stop offset="1" stop-color="#d9a95f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9ae"/>
      <stop offset="0.5" stop-color="#e8bf6d"/>
      <stop offset="1" stop-color="#c1913c"/>
    </linearGradient>

    <!-- A single strawberry: body, highlight, seeds, calyx. -->
    <g id="straw">
      <path d="M0,-46 C26,-46 40,-26 40,-4 C40,26 20,50 0,50 C-20,50 -40,26 -40,-4 C-40,-26 -26,-46 0,-46 Z" fill="url(#berry)"/>
      <path d="M-14,-34 C-26,-24 -30,-8 -28,6 C-34,-12 -28,-32 -14,-34 Z" fill="#ff8f9e" opacity="0.6"/>
      <g fill="#ffe6b8" opacity="0.75">
        <ellipse cx="-16" cy="-12" rx="3" ry="4.5"/><ellipse cx="4" cy="-22" rx="3" ry="4.5"/>
        <ellipse cx="18" cy="-4" rx="3" ry="4.5"/><ellipse cx="-6" cy="6" rx="3" ry="4.5"/>
        <ellipse cx="12" cy="22" rx="3" ry="4.5"/><ellipse cx="-20" cy="16" rx="3" ry="4.5"/>
      </g>
      <path d="M0,-58 L14,-40 L34,-46 L22,-30 L0,-36 L-22,-30 L-34,-46 L-14,-40 Z" fill="#4e7a3a"/>
      <rect x="-3" y="-70" width="6" height="16" rx="3" fill="#3d6330"/>
    </g>

    <!-- A macaron: two shells, ruffled feet, filling. -->
    <g id="mac">
      <ellipse cx="0" cy="-16" rx="46" ry="26" fill="url(#shellA)"/>
      <ellipse cx="0" cy="16" rx="46" ry="26" fill="url(#shellA)"/>
      <rect x="-44" y="-8" width="88" height="18" rx="8" fill="#7c3b2a"/>
      <ellipse cx="-14" cy="-24" rx="18" ry="8" fill="#fff4f1" opacity="0.55"/>
    </g>

    <!-- A blueberry: body plus the pale crown. -->
    <g id="blueb">
      <circle r="26" fill="url(#blue)"/>
      <circle cx="-8" cy="-9" r="7" fill="#a9a6e0" opacity="0.45"/>
      <path d="M-9,-6 L0,-13 L9,-6 L5,4 L-5,4 Z" fill="#171436" opacity="0.55"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="url(#base)"/>
  <rect width="800" height="600" fill="url(#keylight)"/>

  <!-- Bokeh field. -->
  <g>
    <circle cx="118" cy="96" r="78" fill="url(#bokeh)" opacity="0.75"/>
    <circle cx="688" cy="140" r="62" fill="url(#bokeh)" opacity="0.6"/>
    <circle cx="404" cy="62" r="44" fill="url(#bokeh)" opacity="0.5"/>
    <circle cx="742" cy="392" r="54" fill="url(#bokeh)" opacity="0.45"/>
    <circle cx="52" cy="330" r="46" fill="url(#bokeh)" opacity="0.45"/>
    <circle cx="250" cy="150" r="34" fill="url(#bokeh)" opacity="0.5"/>
    <circle cx="560" cy="440" r="40" fill="url(#bokeh)" opacity="0.35"/>
  </g>

  <!-- Chocolate splash arcing behind the cake. -->
  <path d="M60,470 C170,392 300,520 420,436 C520,366 620,430 760,368 L790,430 C640,500 540,436 452,494 C340,566 190,540 74,528 Z"
        fill="url(#ganache)" opacity="0.9"/>
  <g fill="#4a2716" opacity="0.85">
    <circle cx="212" cy="392" r="13"/><circle cx="500" cy="384" r="10"/>
    <circle cx="672" cy="330" r="15"/><circle cx="352" cy="556" r="12"/>
  </g>

  <!-- The cake: stand, two tiers, ganache drip, gold band, berry crown. -->
  <g>
    <ellipse cx="400" cy="468" rx="188" ry="34" fill="#1d0d0c" opacity="0.55"/>
    <ellipse cx="400" cy="452" rx="176" ry="30" fill="url(#gold)" opacity="0.75"/>
    <rect x="272" y="316" width="256" height="132" rx="16" fill="url(#sponge)"/>
    <path d="M272,332 C300,368 330,318 366,352 C400,384 428,326 464,356 C494,382 516,336 528,352 L528,316 L272,316 Z" fill="url(#ganache)"/>
    <rect x="272" y="404" width="256" height="16" fill="url(#gold)" opacity="0.6"/>
    <rect x="322" y="200" width="156" height="120" rx="14" fill="url(#sponge)"/>
    <path d="M322,214 C344,246 372,204 400,234 C428,262 452,214 478,238 L478,200 L322,200 Z" fill="url(#ganache)"/>
    <use href="#straw" transform="translate(400,164) scale(0.62)"/>
    <use href="#blueb" transform="translate(348,186) scale(0.6)"/>
    <use href="#blueb" transform="translate(452,188) scale(0.55)"/>
  </g>

  <!-- Strawberry cluster, lower left. -->
  <use href="#straw" transform="translate(214,498) rotate(-14) scale(1.05)"/>
  <use href="#straw" transform="translate(292,552) rotate(16) scale(0.85)"/>
  <use href="#straw" transform="translate(96,556) rotate(6) scale(0.8)"/>

  <!-- Macarons, right of the cake. -->
  <use href="#mac" transform="translate(604,220) rotate(-10)"/>
  <use href="#mac" transform="translate(722,300) rotate(8) scale(0.85)"/>
  <g transform="translate(596,326) rotate(-6) scale(0.78)">
    <ellipse cx="0" cy="-16" rx="46" ry="26" fill="url(#shellB)"/>
    <ellipse cx="0" cy="16" rx="46" ry="26" fill="url(#shellB)"/>
    <rect x="-44" y="-8" width="88" height="18" rx="8" fill="#8d4a2f"/>
  </g>

  <!-- Loose blueberries. -->
  <use href="#blueb" transform="translate(520,536) scale(1.1)"/>
  <use href="#blueb" transform="translate(596,566) scale(0.85)"/>
  <use href="#blueb" transform="translate(224,262) scale(0.8)"/>

  <!-- Gold confetti. -->
  <g fill="url(#gold)">
    <rect x="96" y="182" width="18" height="7" rx="3" transform="rotate(-24 105 185)"/>
    <rect x="300" y="104" width="16" height="6" rx="3" transform="rotate(38 308 107)"/>
    <rect x="596" y="72" width="20" height="7" rx="3" transform="rotate(-12 606 75)"/>
    <rect x="724" y="470" width="17" height="6" rx="3" transform="rotate(28 732 473)"/>
    <rect x="256" y="452" width="15" height="6" rx="3" transform="rotate(-40 263 455)"/>
    <rect x="470" y="118" width="14" height="6" rx="3" transform="rotate(18 477 121)"/>
    <rect x="40" y="424" width="16" height="6" rx="3" transform="rotate(-30 48 427)"/>
    <rect x="666" y="424" width="15" height="6" rx="3" transform="rotate(46 673 427)"/>
    <circle cx="230" cy="238" r="5"/><circle cx="536" cy="176" r="4"/>
    <circle cx="76" cy="132" r="4"/><circle cx="760" cy="234" r="5"/>
    <circle cx="424" cy="510" r="4"/><circle cx="330" cy="352" r="4"/>
  </g>
</svg>
